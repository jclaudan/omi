services:
  # PostgreSQL Database (Supabase Alternative)
  postgres:
    image: postgres:15-alpine
    container_name: omi-supabase
    ports:
      - "5432:5432"      # PostgreSQL
    environment:
      POSTGRES_DB: ${DB_NAME:-omi}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - supabase_data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: pg_isready -U postgres
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - omi-network

  # PostgREST API (REST API for PostgreSQL)
  postgrest:
    image: postgrest/postgrest:latest
    container_name: omi-postgrest
    ports:
      - "8000:3000"      # PostgREST API
    environment:
      PGRST_DB_URI: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-omi}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-token-change-me}
    depends_on:
      - postgres
    healthcheck:
      test: curl -f http://localhost:3000/ || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - omi-network

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: omi-qdrant
    ports:
      - "6333:6333"      # Qdrant API
      - "6334:6334"      # gRPC
    environment:
      QDRANT_TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: curl -f http://localhost:6333/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - omi-network

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: omi-minio
    ports:
      - "9000:9000"      # MinIO API
      - "9001:9001"      # MinIO Console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio_data:/minio/data
    command: server /minio/data --console-address ":9001"
    healthcheck:
      test: curl -f http://localhost:9000/minio/health/live || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - omi-network

  # Faster-Whisper STT Service (using OpenAI Whisper alternative)
  faster-whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    container_name: omi-faster-whisper
    ports:
      - "8001:9000"      # HTTP API
    environment:
      WORKERS: 1
    volumes:
      - whisper_models:/root/.cache/torch/whisper-multilingual
    healthcheck:
      test: wget -q -O- http://localhost:9000/status || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - omi-network

  # Ollama LLM Service
  ollama:
    image: ollama/ollama:latest
    container_name: omi-ollama
    ports:
      - "11434:11434"    # Ollama API
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: curl -f http://localhost:11434/api/tags || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - omi-network
    # Note: Uncomment for GPU support (NVIDIA)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # Redis Cache (Optional)
  redis:
    image: redis:7-alpine
    container_name: omi-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - omi-network

volumes:
  supabase_data:
  qdrant_data:
  minio_data:
  whisper_models:
  ollama_data:
  redis_data:

networks:
  omi-network:
    driver: bridge
